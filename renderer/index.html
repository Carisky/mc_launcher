<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://unpkg.com; img-src 'self' data: https://*; connect-src 'self' https://codeload.github.com;"
    />
    <title>Custom MC Launcher</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="root"></div>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
      const { useState, useEffect, useMemo, useRef, useCallback } = React;

      const clamp = (value, min, max) => Math.min(max, Math.max(min, value));

      const MIN_SERVER_REFRESH_MS = 10000;
      const PROFILE_GRADIENTS = [
        "linear-gradient(135deg, #22d3ee 0%, #6366f1 100%)",
        "linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%)",
        "linear-gradient(135deg, #f97316 0%, #ef4444 100%)",
        "linear-gradient(135deg, #34d399 0%, #10b981 100%)",
        "linear-gradient(135deg, #38bdf8 0%, #818cf8 100%)",
        "linear-gradient(135deg, #f472b6 0%, #6366f1 100%)",
      ];

      const PROFILE_GLYPHS = ["🧙", "🛡️", "🐉", "🌌", "🧊", "🦊"];

      const sumCharCodes = (value) =>
        (value || "")
          .split("")
          .reduce((acc, char) => acc + char.charCodeAt(0), 0);

      const getProfileVisuals = (profile = {}, index = 0) => {
        const seed =
          sumCharCodes(profile.id || profile.label || profile.nickname) + index;
        const gradient = PROFILE_GRADIENTS[seed % PROFILE_GRADIENTS.length];
        const glyph = PROFILE_GLYPHS[seed % PROFILE_GLYPHS.length];
        const base =
          (profile.nickname || profile.label || "Игрок").trim() || "Игрок";
        const initial = base.slice(0, 1).toUpperCase();
        return { gradient, glyph, initial };
      };

      const getTimeGreeting = () => {
        const hour = new Date().getHours();
        if (hour < 5) return "Доброй ночи";
        if (hour < 12) return "Доброе утро";
        if (hour < 18) return "Добрый день";
        return "Добрый вечер";
      };

      function App() {
        const [bootstrapped, setBootstrapped] = useState(false);
        const [modpacks, setModpacks] = useState([]);
        const [activeModpackId, setActiveModpackId] = useState(null);
        const [paths, setPaths] = useState({});
        const [servers, setServers] = useState([]);
        const [serverStatuses, setServerStatuses] = useState({});
        const [nickname, setNickname] = useState("Player");
        const [ram, setRam] = useState(2048);
        const [status, setStatus] = useState("Загрузка…");
        const [logs, setLogs] = useState([]);
        const [progress, setProgress] = useState(null);
        const [profiles, setProfiles] = useState([]);
        const [activeProfileId, setActiveProfileId] = useState(null);
        const [defaults, setDefaults] = useState({
          ramMb: 2048,
          minRamMb: 1024,
        });
        const [syncing, setSyncing] = useState(false);
        const [launching, setLaunching] = useState(false);
        const [profileModalOpen, setProfileModalOpen] = useState(false);
        const [profileModalLabel, setProfileModalLabel] = useState("");
        const [profileModalNickname, setProfileModalNickname] = useState("");
        const [profileModalRam, setProfileModalRam] = useState("");
        const [profileModalSaving, setProfileModalSaving] = useState(false);
        const [profileModalError, setProfileModalError] = useState("");
        const profileModalLabelRef = useRef(null);
        const logsRef = useRef(null);
        const readyRef = useRef(false);
        const skipSettingsSync = useRef(false);
        const serverTimersRef = useRef({});
        const isMountedRef = useRef(true);

        useEffect(() => {
          if (profileModalOpen && profileModalLabelRef.current) {
            profileModalLabelRef.current.focus();
          }
        }, [profileModalOpen]);

        useEffect(() => {
          return () => {
            isMountedRef.current = false;
            Object.values(serverTimersRef.current || {}).forEach((timer) => clearInterval(timer));
            serverTimersRef.current = {};
          };
        }, []);

        const applySettings = (
          nextSettings,
          opts = { preserveNickname: false }
        ) => {
          skipSettingsSync.current = true;
          if (!opts.preserveNickname) {
            setNickname(nextSettings.nickname ?? "Player");
          }
          setRam(nextSettings.ramMb ?? defaults.ramMb);
          const nextProfiles = nextSettings.profiles ?? [];
          setProfiles(nextProfiles);
          const potentialActive = nextSettings.activeProfileId ?? null;
          const hasActive =
            potentialActive !== null &&
            nextProfiles.some((profile) => profile.id === potentialActive);
          if (hasActive) {
            setActiveProfileId(potentialActive);
          } else {
            setActiveProfileId(nextProfiles[0]?.id ?? null);
          }
        };

        const getServerDisplayAddress = useCallback((entry) => {
          if (!entry) return "-";
          if (entry.displayAddress) return entry.displayAddress;
          if (entry.address && entry.port) {
            return `${entry.address}:${entry.port}`;
          }
          return entry.address || "-";
        }, []);

        const formatRelativeTime = useCallback((timestamp) => {
          if (!timestamp) return "—";
          const diff = Date.now() - timestamp;
          if (diff < 1500) return "только что";
          if (diff < 60000) return `${Math.floor(diff / 1000)} сек назад`;
          if (diff < 3600000) return `${Math.floor(diff / 60000)} мин назад`;
          const date = new Date(timestamp);
          return date.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
        }, []);

        const formatTps = (tps) => {
          if (typeof tps !== "number" || !Number.isFinite(tps)) return "—";
          const rounded = Math.round(tps * 10) / 10;
          return Number.isInteger(rounded) ? String(rounded) : rounded.toFixed(1);
        };

        const formatLatency = (latency) => {
          if (typeof latency !== "number" || !Number.isFinite(latency)) return "—";
          return `${latency} мс`;
        };

        const formatPlayers = (online, max) => {
          if (typeof online !== "number" || !Number.isFinite(online)) return "—";
          if (typeof max === "number" && Number.isFinite(max) && max > 0) {
            return `${online} / ${max}`;
          }
          return `${online}`;
        };

        const refreshServerStatus = useCallback(
          async (server) => {
            if (!server || typeof window.launcher?.fetchServerStatus !== "function") {
              return;
            }

            const serverId = server.id;
            setServerStatuses((prev) => ({
              ...prev,
              [serverId]: {
                ...(prev[serverId] || {}),
                loading: true,
                error: null
              }
            }));

            try {
              const response = await window.launcher.fetchServerStatus(serverId);
              if (!isMountedRef.current) {
                return;
              }
              if (response?.ok) {
                setServerStatuses((prev) => ({
                  ...prev,
                  [serverId]: {
                    loading: false,
                    error: null,
                    data: response.status,
                    server: response.server || server
                  }
                }));
              } else {
                setServerStatuses((prev) => ({
                  ...prev,
                  [serverId]: {
                    ...(prev[serverId] || {}),
                    loading: false,
                    data: response?.status || null,
                    server: response?.server || server,
                    error: response?.error || "Не удалось получить статус."
                  }
                }));
              }
            } catch (error) {
              if (!isMountedRef.current) {
                return;
              }
              setServerStatuses((prev) => ({
                ...prev,
                [serverId]: {
                  ...(prev[serverId] || {}),
                  loading: false,
                  data: null,
                  server,
                  error: error?.message || "Не удалось получить статус."
                }
              }));
            }
          },
          [setServerStatuses]
        );

        const canFetchServerStatus =
          typeof window.launcher?.fetchServerStatus === "function";

        useEffect(() => {
          (async () => {
            try {
              const bootstrap = await window.launcher.bootstrap();
              setModpacks(bootstrap.modpacks || []);
              setActiveModpackId(bootstrap.activeModpackId || null);
              setPaths(bootstrap.paths || {});
              setServers(
                Array.isArray(bootstrap.servers) ? bootstrap.servers : []
              );
              setServerStatuses({});
              setDefaults(
                bootstrap.defaults || { ramMb: 2048, minRamMb: 1024 }
              );
              applySettings(bootstrap.settings || {});
              setStatus("Лаунчер готов! Выбирайте сборку или профиль.");
              setBootstrapped(true);
              readyRef.current = true;
            } catch (err) {
              console.error(err);
              setStatus("Ошибка инициализации: " + err.message);
            }
          })();
        }, []);

        useEffect(() => {
          window.launcher.onLog((msg) => {
            setLogs((prev) => {
              const next = [...prev, msg];
              return next.slice(-500);
            });
          });
          window.launcher.onProgress((payload) => {
            setProgress(payload);
          });
        }, []);

        useEffect(() => {
          Object.values(serverTimersRef.current || {}).forEach((timer) =>
            clearInterval(timer)
          );
          serverTimersRef.current = {};

          if (
            !servers.length ||
            typeof window.launcher?.fetchServerStatus !== "function"
          ) {
            return;
          }

          const timers = {};
          servers.forEach((server) => {
            const interval = Math.max(
              MIN_SERVER_REFRESH_MS,
              Number(server.refreshIntervalMs) || 60000
            );
            const run = () => refreshServerStatus(server);
            run();
            timers[server.id] = setInterval(run, interval);
          });

          serverTimersRef.current = timers;

          return () => {
            Object.values(timers).forEach((timer) => clearInterval(timer));
          };
        }, [servers, refreshServerStatus]);

        useEffect(() => {
          if (logsRef.current) {
            logsRef.current.scrollTop = logsRef.current.scrollHeight;
          }
        }, [logs]);

        useEffect(() => {
          if (!readyRef.current) return;
          if (skipSettingsSync.current) {
            skipSettingsSync.current = false;
            return;
          }
          const handle = setTimeout(() => {
            window.launcher
              .updateSettings({
                nickname,
                ramMb: Number(ram),
              })
              .catch((err) => console.error(err));
          }, 400);
          return () => clearTimeout(handle);
        }, [nickname, ram]);

        useEffect(() => {
          if (!readyRef.current) return;
          if (skipSettingsSync.current) {
            skipSettingsSync.current = false;
            return;
          }
          window.launcher
            .updateSettings({
              activeProfileId,
            })
            .catch((err) => console.error(err));
        }, [activeProfileId]);

        useEffect(() => {
          if (!activeProfileId) return;
          setProfiles((prev) =>
            prev.map((p) => (p.id === activeProfileId ? { ...p, nickname } : p))
          );
        }, [nickname, activeProfileId]);

      const activeModpack = useMemo(
        () => modpacks.find((pack) => pack.id === activeModpackId) || null,
        [modpacks, activeModpackId]
      );

      useEffect(() => {
        if (!profiles.length) {
          if (activeProfileId !== null) setActiveProfileId(null);
          return;
        }
        if (!activeProfileId) {
          setActiveProfileId(profiles[0].id);
          return;
        }
        if (!profiles.some((profile) => profile.id === activeProfileId)) {
          setActiveProfileId(profiles[0].id);
        }
      }, [profiles, activeProfileId]);

      const activeProfile = useMemo(
        () => profiles.find((profile) => profile.id === activeProfileId) || null,
        [profiles, activeProfileId]
      );

        const greeting = useMemo(() => getTimeGreeting(), []);
        const editorKey = useMemo(
          () =>
            `${activeProfileId ?? "none"}-${profiles
              .map((p) => p.id)
              .join("|")}`,
          [activeProfileId, profiles]
        );
        const bannerSubtitle = useMemo(() => {
          if (activeModpack) {
            return `Готовы к приключениям в сборке "${activeModpack.name}"? Мы уже все подготовили.`;
          }
          if (modpacks.length) {
            return `Выберите одну из ${modpacks.length} готовых сборок или синхронизируйте новые.`;
          }
          return "Нажмите «Синхронизировать моды», чтобы загрузить первую сборку.";
        }, [activeModpack, modpacks.length]);

        const profileSummary = useMemo(() => {
          const label = activeProfile?.label || "Черновой профиль";
          return `Профиль "${label}" · Память ${ram} МБ · Ник ${nickname}`;
        }, [activeProfile, ram, nickname]);

        const bannerVisuals = useMemo(() => {
          const baseProfile = activeProfile || {
            id: "virtual-active",
            label: "Черновой профиль",
            nickname: nickname || "Игрок",
          };
          return getProfileVisuals(baseProfile);
        }, [activeProfile, nickname]);

        const serversLoading = useMemo(
          () =>
            servers.some((server) => serverStatuses[server.id]?.loading),
          [servers, serverStatuses]
        );

        const handleServerStatusRefresh = useCallback(() => {
          servers.forEach((server) => refreshServerStatus(server));
        }, [servers, refreshServerStatus]);

        const handleRamInput = (value) => {
          setRam(value);
        };

        const commitRamValue = () => {
          const numeric = Number(ram);
          if (!Number.isFinite(numeric)) {
            setRam(defaults.ramMb);
            return;
          }
          const clamped = clamp(
            Math.round(numeric),
            defaults.minRamMb || 1024,
            65536
          );
          setRam(clamped);
        };

        const openProfileModal = () => {

          const baseNickname = (activeProfile?.nickname || nickname || "Player").trim() || "Player";

          const labelSuggestion = `${baseNickname} #${profiles.length + 1}`;

          const ramSuggestion = clamp(

            Number(ram) || defaults.ramMb || 2048,

            defaults.minRamMb || 1024,

            65536

          );

          setProfileModalLabel(labelSuggestion);

          setProfileModalNickname(baseNickname);

          setProfileModalRam(String(ramSuggestion));

          setProfileModalError("");

          setProfileModalOpen(true);

        };



        const closeProfileModal = () => {

          if (profileModalSaving) return;

          setProfileModalOpen(false);

        };



        const handleProfileModalSubmit = async (event) => {
          if (event) {
            event.preventDefault();
          }
          if (profileModalSaving) return;

          const cleanNickname = profileModalNickname.trim() || "Player";
          const cleanLabel =
            profileModalLabel.trim() ||
            `${cleanNickname} #${profiles.length + 1}`;
          const numericRam = clamp(
            Math.round(Number(profileModalRam) || defaults.ramMb || 2048),
            defaults.minRamMb || 1024,
            65536
          );

          setProfileModalNickname(cleanNickname);
          setProfileModalLabel(cleanLabel);
          setProfileModalRam(String(numericRam));

          try {
            setProfileModalSaving(true);
            setProfileModalError("");
            const settings = await window.launcher.saveProfile({
              label: cleanLabel,
              nickname: cleanNickname,
              ramMb: numericRam,
            });
            applySettings(settings);
            setStatus(
              `Профиль "${cleanLabel}" сохранен. Можно переключаться в списке слева.`
            );
            setProfileModalOpen(false);
          } catch (err) {
            setProfileModalError(err.message);
          } finally {
            setProfileModalSaving(false);
          }
        };

        const handleProfileModalRamChange = (value) => {

          setProfileModalRam(value);

        };



        const handleSyncMods = async () => {
          try {
            setSyncing(true);
            setStatus("Синхронизируем моды...");
            const res = await window.launcher.syncMods();
            if (res.ok) {
              setStatus(`Готово! Скопировано файлов: ${res.copied || 0}.`);
            } else {
              setStatus("Не удалось синхронизировать моды: " + res.error);
            }
          } catch (err) {
            setStatus("Не удалось синхронизировать моды: " + err.message);
          } finally {
            setSyncing(false);
          }
        };

        const handleOpenMods = async () => {
          try {
            await window.launcher.openModsFolder(activeModpackId);
            setStatus("Открываем папку с модами. Настраивайте игру под себя!");
          } catch (err) {
            setStatus("Не удалось открыть папку модов: " + err.message);
          }
        };

        const handleLaunch = async () => {
          try {
            setLaunching(true);
            setStatus("Запускаем Minecraft...");
            const res = await window.launcher.launch({
              username: nickname,
              ramMb: Number(ram),
            });
            if (res.ok) {
              setStatus("Minecraft запущен. Приятной игры!");
            } else {
              setStatus("Не получилось запустить игру: " + res.error);
            }
          } catch (err) {
            setStatus("Не получилось запустить игру: " + err.message);
          } finally {
            setLaunching(false);
          }
        };

        const handleAddProfile = () => {

          openProfileModal();

        };



        const handleProfileSelect = async (profile) => {
          try {
            // сначала локально переключаемся
            setActiveProfileId(profile.id);
            setNickname(profile.nickname || "Player");
            setRam(profile.ramMb ?? defaults.ramMb);

            // потом уведомляем бэк, но НЕ применяем его settings
            await window.launcher.activateProfile(profile.id);

            setStatus(`Профиль "${profile.label}" активирован.`);
          } catch (err) {
            setStatus("Не удалось активировать профиль: " + err.message);
          }
        };

        const handleProfileDelete = async (profile) => {
          const confirmed = window.confirm(
            `Удалить профиль "${profile.label}"?`
          );
          if (!confirmed) return;

          try {
            const wasActive = profile.id === activeProfileId;
            await window.launcher.deleteProfile(profile.id);

            // локально правим состояние, НЕ трогаем nickname/ram
            setProfiles((prev) => prev.filter((p) => p.id !== profile.id));
            if (wasActive) setActiveProfileId(null);

            setStatus(`Профиль "${profile.label}" удален.`);
          } catch (err) {
            setStatus("Не удалось удалить профиль: " + err.message);
          }
        };

        const handleModpackSelect = async (modpack) => {
          if (!modpack || modpack.id === activeModpackId) return;
          try {
            setStatus(`Переключаемся на сборку "${modpack.name}"...`);
            const result = await window.launcher.selectModpack(modpack.id);
            setActiveModpackId(result.activeModpackId);
            setPaths(result.paths || {});
            if (result.settings) {
              applySettings(result.settings);
            }
            setStatus(`Сборка "${modpack.name}" готова.`);
          } catch (err) {
            setStatus("Не удалось активировать сборку: " + err.message);
          }
        };

        const progressPercent =
          progress && progress.task && progress.task.total
            ? Math.round((progress.task.progress / progress.task.total) * 100)
            : 0;

        return (
          <div className="app-shell">
            {!bootstrapped && (
              <div className="loading-overlay">
                <div className="spinner" />
                <p>Готовим лаунчер…</p>
              </div>
            )}

            <aside className="sidebar">
              <div className="brand">
                <span className="brand-accent">Custom</span>
                <span>Launcher</span>
                <span className="brand-sub">Minecraft Edition</span>
              </div>
              <div className="sidebar-section highlight">
                <div className="sidebar-header">
                  <h2>Сборки</h2>
                </div>
                <div className="modpack-grid">
                  {modpacks.map((pack) => {
                    const isActive = pack.id === activeModpackId;
                    return (
                      <button
                        key={pack.id}
                        className={`modpack-tile${isActive ? " active" : ""}`}
                        onClick={() => handleModpackSelect(pack)}
                      >
                        {pack.icon ? (
                          <img src={pack.icon} alt={pack.name} />
                        ) : (
                          <div className="modpack-placeholder">
                            <span>{pack.name.slice(0, 1).toUpperCase()}</span>
                          </div>
                        )}
                        <div className="modpack-meta">
                          <div className="title">{pack.name}</div>
                          <div className="subtitle">
                            {pack.description || "Описание появится позже"}
                          </div>
                        </div>
                        <span className="modpack-pill" aria-hidden="true" />
                      </button>
                    );
                  })}
                  {!modpacks.length && (
                    <div className="empty-state">
                      Сборок пока нет. Нажмите «Синхронизировать моды», чтобы
                      загрузить первую.
                    </div>
                  )}
                </div>
              </div>

              <div className="sidebar-section">
                <div className="sidebar-header">
                  <h2>Профили</h2>
                  <button
                    className="icon-button"
                    type="button"
                    onClick={handleAddProfile}
                    title="Сохранить новый профиль"
                  >
                    +
                  </button>
                </div>
                <div className="profile-list">
                  {profiles.map((profile, index) => {
                    const visuals = getProfileVisuals(profile, index);
                    return (
                      <div
                        key={profile.id}
                        className={`profile-card${
                          profile.id === activeProfileId ? " active" : ""
                        }`}
                      >
                        <button
                          className="profile-main"
                          onClick={() => handleProfileSelect(profile)}
                        >
                          <div
                            className="profile-avatar"
                            style={{ background: visuals.gradient }}
                          >
                            <span
                              className="profile-avatar-icon"
                              aria-hidden="true"
                            >
                              {visuals.glyph || visuals.initial}
                            </span>
                          </div>
                          <div className="profile-meta">
                            <div className="profile-title">{profile.label}</div>
                            <div className="profile-subtitle">
                              {profile.nickname} · {profile.ramMb} МБ
                            </div>
                          </div>
                        </button>
                        <button
                          className="icon-button danger"
                          type="button"
                          onClick={() => handleProfileDelete(profile)}
                          title="Удалить профиль"
                          aria-label={`Удалить профиль ${profile.label}`}
                        >
                          ×
                        </button>
                      </div>
                    );
                  })}
                  {!profiles.length && (
                    <div className="empty-state small">
                      Здесь появятся ваши сохраненные профили. Сохраните текущие
                      настройки, чтобы собрать коллекцию.
                    </div>
                  )}
                </div>
              </div>
            </aside>

            <main className="main-area">
              <section className="user-banner">
                <div
                  className="user-banner-avatar"
                  style={{ background: bannerVisuals.gradient }}
                >
                  <span className="user-banner-icon" aria-hidden="true">
                    {bannerVisuals.glyph || bannerVisuals.initial}
                  </span>
                </div>
                <div className="user-banner-content">
                  <p className="user-greeting">
                    {greeting}, {nickname || "Игрок"}!
                  </p>
                  <div className="user-banner-footer">
                    <span>{profileSummary}</span>
                    <button className="ghost-button" onClick={handleAddProfile}>
                      Сохранить текущий профиль
                    </button>
                  </div>
                </div>
              </section>
              <header className="main-header">
                <div>
                  <h1>
                    {activeModpack ? activeModpack.name : "Minecraft Launcher"}
                  </h1>
                  <p className="subtitle">
                    {activeModpack
                      ? activeModpack.description || "Forge 1.12.2"
                      : "Forge 1.12.2"}
                  </p>
                </div>
                <div className="header-actions">
                  <button
                    className="action-button accent"
                    onClick={handleSyncMods}
                    disabled={syncing}
                  >
                    <span aria-hidden="true">🔄</span>
                    {syncing ? "Синхронизируем..." : "Синхронизировать моды"}
                  </button>
                  <button className="action-button" onClick={handleOpenMods}>
                    <span aria-hidden="true">📂</span>
                    Открыть папку модов
                  </button>
                </div>
              </header>

              {servers.length > 0 && (
                <section className="card server-card">
                  <div className="server-card-header">
                    <div>
                      <h2>Статус сервера</h2>
                      <p className="subtitle">
                        Онлайн, TPS и пинг вашего сервера в реальном времени.
                      </p>
                    </div>
                    {canFetchServerStatus ? (
                      <button
                        type="button"
                        className="ghost-button"
                        onClick={handleServerStatusRefresh}
                        disabled={serversLoading}
                      >
                        {serversLoading ? "Обновляем..." : "Обновить"}
                      </button>
                    ) : (
                      <span className="server-card-hint">
                        Обновление недоступно в этой сборке
                      </span>
                    )}
                  </div>

                  {!canFetchServerStatus && (
                    <p className="server-status-hint">
                      Добавьте поддержку обновления статуса в preload, чтобы
                      включить автоматическое обновление.
                    </p>
                  )}

                  <div className="server-status-list">
                    {servers.map((server) => {
                      const entry = serverStatuses[server.id] || {};
                      const data = entry.data;
                      const icon = data?.icon;
                      const serverInfo = entry.server || server;
                      const name = serverInfo?.name || server.name;
                      const displayAddress = getServerDisplayAddress(serverInfo);
                      const online = Boolean(data?.online);
                      const playersOnline =
                        typeof data?.playersOnline === "number"
                          ? data.playersOnline
                          : null;
                      const playersMax =
                        typeof data?.playersMax === "number"
                          ? data.playersMax
                          : null;
                      const latency = data?.latencyMs;
                      const tps = data?.tps;
                      const lastUpdated = data?.fetchedAt;
                      const error = entry.error;
                      const loading = entry.loading;
                      const fallbackGradient =
                        PROFILE_GRADIENTS[
                          sumCharCodes(server.id || server.address) %
                            PROFILE_GRADIENTS.length
                        ];
                      const initial =
                        (
                          (name || displayAddress || "S").trim().charAt(0) || "S"
                        ).toUpperCase();

                      return (
                        <article className="server-status-entry" key={server.id}>
                          <div
                            className="server-status-avatar"
                            style={{ background: fallbackGradient }}
                          >
                            {icon ? (
                              <img src={icon} alt={`${name} icon`} />
                            ) : (
                              <span>{initial}</span>
                            )}
                          </div>
                          <div className="server-status-body">
                            <div className="server-status-header">
                              <div className="server-status-title">
                                <span
                                  className={`status-dot ${
                                    online ? "online" : "offline"
                                  }`}
                                  aria-hidden="true"
                                />
                                <span>{name}</span>
                              </div>
                              <span className="server-status-updated">
                                {loading
                                  ? "Обновляем..."
                                  : data
                                  ? `Обновлено ${formatRelativeTime(lastUpdated)}`
                                  : canFetchServerStatus
                                  ? "Ожидаем данные"
                                  : "Недоступно"}
                              </span>
                            </div>
                            <div className="server-status-address">
                              IP: <code>{displayAddress}</code>
                            </div>
                            <div className="server-status-meta">
                              <div>
                                <span className="meta-label">Статус</span>
                                <span
                                  className={`meta-value ${
                                    online ? "online" : "offline"
                                  }`}
                                >
                                  {online ? "Онлайн" : "Оффлайн"}
                                </span>
                              </div>
                              <div>
                                <span className="meta-label">Игроки</span>
                                <span className="meta-value">
                                  {formatPlayers(playersOnline, playersMax)}
                                </span>
                              </div>
                              <div>
                                <span className="meta-label">TPS</span>
                                <span className="meta-value">
                                  {online ? formatTps(tps) : "—"}
                                </span>
                              </div>
                              <div>
                                <span className="meta-label">Пинг</span>
                                <span className="meta-value">
                                  {online ? formatLatency(latency) : "—"}
                                </span>
                              </div>
                            </div>
                            {data?.motd && (
                              <p className="server-motd">{data.motd}</p>
                            )}
                            {error && !loading && (
                              <p className="server-status-error">{error}</p>
                            )}
                          </div>
                        </article>
                      );
                    })}
                  </div>
                </section>
              )}

              <section className="card control-card">
                <div className="field-grid">
                  <label>
                    Никнейм
                    <input
                      key={`nick-${editorKey}`}
                      value={nickname}
                      onChange={(e) => setNickname(e.target.value)}
                      maxLength={32}
                      placeholder="Player"
                    />
                  </label>

                  <label>
                    RAM (MB)
                    <input
                      key={`ram-${editorKey}`}
                      type="number"
                      value={ram}
                      min={defaults.minRamMb || 1024}
                      max={65536}
                      step="256"
                      onChange={(e) => handleRamInput(e.target.value)}
                      onBlur={commitRamValue}
                    />
                    <span className="hint">
                      Минимум {defaults.minRamMb || 1024} МБ. Комфортно играть
                      на {Math.max(defaults.ramMb, defaults.minRamMb)} МБ и
                      выше.
                    </span>
                  </label>
                </div>

                <div className="actions-row">
                  <button
                    className="primary"
                    onClick={handleLaunch}
                    disabled={launching}
                  >
                    {launching ? "Запускаем…" : "Играть сейчас"}
                  </button>
                  <div className="status-line">{status}</div>
                </div>

                {progress && progressPercent > 0 && (
                  <div className="progress">
                    <div
                      className="progress-bar"
                      style={{ width: `${progressPercent}%` }}
                    />
                    <span className="progress-text">
                      {progressPercent}% ·{" "}
                      {progress.type || "подготовка файлов"}
                    </span>
                  </div>
                )}

                <div className="paths">
                  <div>
                    <span className="paths-label">Папка игры:</span>
                    <code>{paths.gameRoot || "—"}</code>
                  </div>
                  <div>
                    <span className="paths-label">Папка модов:</span>
                    <code>{paths.modsDir || "—"}</code>
                  </div>
                </div>
              </section>

              <section className="card logs-card">
                <div className="logs-header">
                  <h2>Логи запуска</h2>
                  <button
                    className="ghost-button small"
                    type="button"
                    onClick={() => setLogs([])}
                    title="Очистить логи"
                  >
                    Очистить
                  </button>
                </div>
                <div className="log-output" ref={logsRef}>
                  <pre>{logs.join("\n")}</pre>
                </div>
              </section>
            </main>

          {profileModalOpen && (
            <div className="modal-backdrop" role="presentation" onClick={closeProfileModal}>
              <div
                className="modal-card"
                role="dialog"
                aria-modal="true"
                onClick={(event) => event.stopPropagation()}
              >
                <header className="modal-header">
                  <h2>Создать профиль</h2>
                  <button
                    type="button"
                    className="icon-button"
                    onClick={closeProfileModal}
                    aria-label="Закрыть диалог"
                    disabled={profileModalSaving}
                  >
                    ×
                  </button>
                </header>
                <form className="modal-body" onSubmit={handleProfileModalSubmit}>
                  <label className="modal-field">
                    Название профиля
                    <input
                      ref={profileModalLabelRef}
                      value={profileModalLabel}
                      onChange={(event) => setProfileModalLabel(event.target.value)}
                      maxLength={48}
                      placeholder="Например, Adventure Pack"
                    />
                  </label>
                  <label className="modal-field">
                    Никнейм
                    <input
                      value={profileModalNickname}
                      onChange={(event) => setProfileModalNickname(event.target.value)}
                      maxLength={32}
                      placeholder="Player"
                    />
                  </label>
                  <label className="modal-field">
                    RAM (MB)
                    <input
                      type="number"
                      value={profileModalRam}
                      min={defaults.minRamMb || 1024}
                      max={65536}
                      step="256"
                      onChange={(event) =>
                        handleProfileModalRamChange(event.target.value)
                      }
                    />
                  </label>
                  {profileModalError && (
                    <div className="modal-error">{profileModalError}</div>
                  )}
                  <footer className="modal-actions">
                    <button
                      type="button"
                      className="ghost-button"
                      onClick={closeProfileModal}
                      disabled={profileModalSaving}
                    >
                      Отмена
                    </button>
                    <button
                      type="submit"
                      className="primary"
                      disabled={profileModalSaving}
                    >
                      {profileModalSaving ? "Сохраняем…" : "Сохранить"}
                    </button>
                  </footer>
                </form>
              </div>
            </div>
          )}
        </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
